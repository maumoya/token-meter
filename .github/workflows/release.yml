# Release: on a version tag (v*), publish the skill as a zip and a signed SLSA build provenance
# file (*.intoto.jsonl) next to it, so anyone can check the zip was built here, from that tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions: read-all

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build zip
        env:
          TAG: ${{ github.ref_name }}
        run: git archive --format=zip --prefix=token-meter/ -o "token-meter-${TAG}.zip" "$TAG" skills/token-meter LICENSE README.md

      - name: Hash
        id: hash
        env:
          TAG: ${{ github.ref_name }}
        run: echo "hashes=$(sha256sum "token-meter-${TAG}.zip" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "token-meter-${TAG}.zip" --verify-tag --title "$TAG" --generate-notes

  provenance:
    name: Signed provenance
    needs: build
    permissions:
      actions: read # read the workflow run
      id-token: write # keyless Sigstore signing
      contents: write # attach the provenance to the release
    # Reusable workflows from slsa-github-generator must be referenced by tag (Scorecard allows it).
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
      provenance-name: token-meter-${{ github.ref_name }}.intoto.jsonl
